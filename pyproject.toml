[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "semantic-faq-api"
version = "1.0.0"
description = "Production-oriented semantic FAQ retrieval and routing API"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [{ name = "Dan" }]
dependencies = [
    "asyncpg>=0.29,<1",
    "fastapi>=0.115,<1",
    "langchain-core>=0.3,<1",
    "langchain-openai>=0.3,<1",
    "pgvector>=0.3,<1",
    "pydantic-settings>=2.7,<3",
    "sqlalchemy[asyncio]>=2.0,<3",
    "uvicorn[standard]>=0.34,<1",
]

[project.optional-dependencies]
dev = [
    "httpx>=0.28,<1",
    "mypy>=1.14,<2",
    "pytest>=8.3,<9",
    "pytest-asyncio>=0.25,<1",
    "ruff>=0.9,<1",
]

[tool.hatch.build.targets.wheel]
packages = ["src/semantic_faq"]

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "ASYNC", "SIM", "RUF"]
ignore = ["B008"]

[tool.ruff.format]
quote-style = "double"

[tool.mypy]
python_version = "3.12"
strict = true
packages = ["semantic_faq"]
mypy_path = "src"
plugins = ["pydantic.mypy"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "-ra --strict-markers"

[tool.coverage.run]
source = ["semantic_faq"]
branch = true

[tool.coverage.report]
show_missing = true
fail_under = 85

'env.example'

APP_ENV=development
LOG_LEVEL=INFO

API_TOKEN=replace-with-a-long-random-token

DATABASE_URL=postgresql+asyncpg://faq:faq@localhost:5432/faq

OPENAI_API_KEY=
OPENAI_CHAT_MODEL=gpt-4.1-mini
OPENAI_EMBEDDING_MODEL=text-embedding-3-small
EMBEDDING_DIMENSIONS=1536

FAQ_COLLECTION=default
LOCAL_MATCH_THRESHOLD=0.78
AMBIGUITY_MARGIN=0.03
MAX_QUESTION_LENGTH=1000
OPENAI_TIMEOUT_SECONDS=20